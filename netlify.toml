[build]
  functions = "netlify/functions"
  publish = "dist"
  command = "npx vite build"

[functions]
  node_bundler = "esbuild"

# 共有レビューURL（/review/:token）を直接開いた場合にもSPAを表示する。
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# === scheduler.ts を毎分実行（テスト） ===
[functions."scheduler"]
  schedule = "*/1 * * * *"
